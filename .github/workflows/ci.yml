name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=optional
      - if: runner.os == 'Linux'
        run: npm install --no-save @rollup/rollup-linux-x64-gnu@4.60.1
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
