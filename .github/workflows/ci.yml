name: CI

on:
  # Standard validation gate for pull requests and protected branch pushes
  pull_request:
  push:
    branches: [develop, main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --prefix apps/frontend @rollup/rollup-linux-x64-gnu --no-save
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test
