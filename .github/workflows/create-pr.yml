name: Create pull request

on:
  workflow_dispatch:
    inputs:
      head_branch:
        description: Pushed feature branch
        required: true
        type: string
      jira_key:
        description: Jira ticket key
        required: true
        type: string
      task_summary:
        description: Jira task title or short summary
        required: false
        type: string
      base_branch:
        description: Pull request target branch
        required: true
        default: develop
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4

      - name: Validate inputs and create pull request
        uses: actions/github-script@v7
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          JIRA_KEY: ${{ inputs.jira_key }}
          TASK_SUMMARY: ${{ inputs.task_summary }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        with:
          github-token: ${{ github.token }}
          script: |
            const { pathToFileURL } = require('node:url');
            const { default: createPullRequest } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/create-pr.mjs`)
            );

            await createPullRequest({ github, context, core });
